<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-i18n="ui.title">Ladeplanung</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<!-- Icons: custom, simple line icons (24x24) -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16.5V12l2-4.5a1.5 1.5 0 0 1 1.4-.9h9.2a1.5 1.5 0 0 1 1.4.9L20 12v4.5M3 16.5h18M6.5 12h11"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/></symbol>
  <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="13" rx="3"/><path d="M5 11h14M8.5 16.5 7 20.5M15.5 16.5l1.5 4M9 14h.01M15 14h.01"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="m10.5 21 2-6-2.5-2.5 1-4.5 3 2 2.5 1M9.5 9.5 7 11M12.5 15l3.5 2.5"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5 5.5 13.5H11l-1 8 7.5-11H12z"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0zM12 17v4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.2a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-temp" viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19zM12 10v4.5M12 17.5h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</svg>

<div class="progress" id="progress" hidden></div>

<!-- Login and initial setup -->
<main id="view-auth" class="auth" hidden>
  <section class="auth-card">
    <div class="auth-art" id="auth-art"></div>
    <div class="auth-body">
      <h1 class="brand"><svg class="ico"><use href="#i-bolt"/></svg><span data-i18n="ui.title"></span></h1>
      <p id="auth-lead" class="lead"></p>
      <form id="auth-form" autocomplete="on">
        <label class="field"><span data-i18n="ui.auth.user"></span>
          <input type="text" name="username" value="admin" autocomplete="username" readonly>
        </label>
        <label class="field"><span data-i18n="ui.auth.password"></span>
          <input type="password" id="pw1" name="password" required autocomplete="current-password" minlength="8">
        </label>
        <label class="field" id="pw2-wrap" hidden><span data-i18n="ui.auth.password_repeat"></span>
          <input type="password" id="pw2" name="password2" autocomplete="new-password" minlength="8">
        </label>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="btn primary" id="auth-submit" type="submit"></button>
      </form>
    </div>
  </section>
</main>

<!-- Main view -->
<div id="view-main" hidden>
  <header class="top">
    <h1 class="brand"><svg class="ico"><use href="#i-bolt"/></svg><span data-i18n="ui.title"></span></h1>
    <div class="top-actions">
      <span class="chip" id="mode-chip"></span>
      <span class="stamp" id="stamp"></span>
      <button class="btn ghost" id="btn-run" type="button" data-i18n-title="ui.top.run_title">
        <svg class="ico"><use href="#i-refresh"/></svg><span data-i18n="ui.top.run"></span>
      </button>
      <button class="btn ghost" id="btn-logout" type="button" data-i18n-aria-label="ui.top.logout" data-i18n-title="ui.top.logout">
        <svg class="ico"><use href="#i-logout"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" data-i18n-aria-label="ui.nav.label">
    <button type="button" data-tab="plan" aria-current="page" data-i18n="ui.tab.plan"></button>
    <button type="button" data-tab="history" data-i18n="ui.tab.history"></button>
    <button type="button" data-tab="settings" data-i18n="ui.tab.settings"></button>
  </nav>

  <div class="layout" id="tab-plan">
    <aside class="vehicle" id="vehicle" data-i18n-aria-label="ui.vehicle.aria">
      <div class="car-art" id="car-art"></div>
      <h2 id="v-title" data-i18n="ui.vehicle.title"></h2>
      <div class="soc"><span class="soc-num" id="v-soc">–</span><span class="soc-unit">%</span><span class="soc-label" data-i18n="ui.soc.label"></span></div>
      <div class="bar bar-lg" id="v-bar" role="img">
        <span class="fill" id="v-fill"></span>
        <span class="flag" id="v-flag" hidden><span class="flag-label" id="v-flag-label"></span></span>
      </div>
      <ul class="facts" id="v-facts"></ul>
      <div class="plan-box" id="plan-box"></div>
    </aside>

    <section class="timeline" data-i18n-aria-label="ui.timeline.aria">
      <div class="alarm" id="alarm" role="alert" hidden></div>
      <div id="days"></div>
      <p class="empty" id="empty" hidden></p>
      <details class="notices" id="notices" hidden>
        <summary><svg class="ico"><use href="#i-info"/></svg><span id="notices-title"></span></summary>
        <ul id="notices-list"></ul>
      </details>
    </section>
  </div>
  <section class="panel" id="tab-history" data-i18n-aria-label="ui.tab.history" hidden>
    <h2 data-i18n="ui.hist.title"></h2>
    <p class="hint" data-i18n="ui.hist.hint"></p>
    <ul class="runs" id="runs-list"></ul>
    <p class="empty" id="runs-empty" data-i18n="ui.hist.empty" hidden></p>
  </section>

  <section class="panel" id="tab-settings" data-i18n-aria-label="ui.tab.settings" hidden>
    <h2 data-i18n="ui.tab.settings"></h2>
    <p class="hint" data-i18n-rich="ui.set.hint"></p>
    <form id="settings-form" autocomplete="off">
      <div id="settings-groups"></div>
      <fieldset class="group">
        <legend data-i18n="ui.rules.title"></legend>
        <p class="hint" data-i18n-rich="ui.rules.hint"></p>
        <ul class="rules" id="rules-list"></ul>
        <button class="btn ghost" id="rule-add" type="button" data-i18n="ui.rules.add"></button>
      </fieldset>
      <p class="form-error" id="settings-error" role="alert" hidden></p>
      <div class="form-actions">
        <button class="btn primary" id="settings-save" type="submit" data-i18n="ui.set.save"></button>
        <button class="btn ghost" id="settings-reset" type="button" data-i18n="ui.set.reset"></button>
      </div>
    </form>
  </section>

  <footer class="foot"><span id="version"></span></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
