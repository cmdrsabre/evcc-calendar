services:
  evcc-kalender:
    image: ghcr.io/cmdrsabre/evcc-calendar:latest
    build: .                               # only used with --build (local development)
    container_name: evcc-kalender
    restart: unless-stopped
    env_file: .env                         # HA_TOKEN, EVCC_API_KEY, ORS_KEY
    user: "${PUID:-1000}:${PGID:-1000}"    # Unraid: 99:100 (nobody:users)
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # allows port 80 without root inside the container
    environment:
      TZ: Europe/Berlin
    volumes:
      - "${DATA_DIR:-/mnt/user/appdata/evcc-kalender}:/data"   # config.yaml and state.db
    ports:
      - "${HOST_PORT:-8180}:80"
