# Example configuration. Copy to /data/config.yaml (in the container) and adjust.
# Secrets are NOT stored here but in environment variables (names below).

home:
  lat: 0.0              # 0/0 = unknown, then `address` is geocoded once
  lon: 0.0
  address: "Wacholderweg 4, 14974 Ludwigsfelde"

ha:
  url: http://192.168.178.88:8123
  token_env: HA_TOKEN                 # Long-Lived Access Token
  calendar: calendar.a_a              # display name "A&a"
  notify_targets:                     # notify.send_message with these target entities
    info:    [notify.iduke_nukem_plus]                                  # confirmations
    warning: [notify.iduke_nukem_plus, notify.home_assistant_telegram_bot_hugh_hefner]
    error:   [notify.iduke_nukem_plus, notify.home_assistant_telegram_bot_hugh_hefner,
              notify.hobbyraum_echo_dot_durchsagen]                      # Alexa announcement only for errors
  weather: weather.forecast_home      # fallback temperature source

evcc:
  url: http://192.168.178.10:7070
  api_key_env: EVCC_API_KEY
  vehicle: "db:1"                     # name from /api/state (empty = the only vehicle)

ors:
  key_env: ORS_KEY
  min_confidence: 0.7                 # below this the address counts as unclear

consumption:
  warm: 20                            # kWh/100 km from temp_threshold_c on
  cold: 23
  temp_threshold_c: 10

reserve_soc: 10                       # percentage points of reserve on return
manual_drive_min: 45                  # assumed travel time for appointments without an address (choose the target in the UI)
min_car_km: 4                        # one-way distance below this: not a car appointment (unless keyword Auto)
unclear_cap_soc: 80                   # cap for unclear classification
time_buffer_min: 30                   # buffer before departure
charge_power_kw: 11
charge_loss_margin: 0.15              # loss margin when recharging between appointments
chain_window_h: 5
horizon_days: 6                       # evcc UI allows at most 6 days ahead
run_every_min: 30
vehicle_limit_min: 100                # warn if the limit set in the car is below this

# Rules: whole words in the title, case-insensitive, * only within a word.
rules:
  - {match: "fritz*", mode: bahn}
  - {match: "uni*", mode: auto}

retries: 3                            # attempts per service and run (evcc, calendar)
retry_delay_s: 5                      # pause before attempt 2, tripled afterwards

dry_run: true                         # set to false only once the dry run looks right
web: {host: 0.0.0.0, port: 80}      # port inside the container; for the published port see HOST_PORT in .env
db_path: /data/state.db
# personal_dir: /data/personal          # own images, default: folder "personal" next to the database
timezone: Europe/Berlin
